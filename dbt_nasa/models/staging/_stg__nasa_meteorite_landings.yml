models:
  - name: stg__nasa_meteorite_landings
    description: "{{ doc('stg__nasa_meteorite_landings') }}"
    columns:
      - name: id
        description: Unique identifier for the meteorite landing record
        tests:
          - not_null
          - unique
      - name: name
        description: Name of the meteorite
        tests:
          - not_null
      - name: nametype
        description: Name type classification of the meteorite (Valid or Relict)
      - name: recclass
        description: Mineralogical classification of the meteorite
      - name: mass
        description: "{{ doc('col_mass_grams') }}"
      - name: fall
        description: Whether the meteorite was observed falling (Fell) or found (Found)
      - name: year
        description: Year the meteorite was found or observed to fall (raw string)
      - name: reclat
        description: Latitude of the meteorite landing location
      - name: reclong
        description: Longitude of the meteorite landing location
      - name: geolocation
        description: Geolocation of the meteorite landing as a coordinate string
