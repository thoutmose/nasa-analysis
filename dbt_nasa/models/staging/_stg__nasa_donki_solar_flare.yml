models:
  - name: stg__nasa_donki_solar_flare
    description: "{{ doc('stg__nasa_donki_solar_flare') }}"
    columns:
      - name: flr_id
        description: "{{ doc('col_flr_id') }}"
        tests:
          - not_null
          - unique
      - name: begin_time
        description: Start timestamp of the solar flare event
        tests:
          - not_null
      - name: peak_time
        description: Timestamp of peak X-ray flux intensity for the solar flare event
      - name: end_time
        description: Timestamp when the solar flare event ended
      - name: class_type
        description: "{{ doc('col_class_type') }}"
        tests:
          - not_null
      - name: source_location
        description: Active region location on the solar disk in Stonyhurst heliographic coordinates (e.g. N15W30)
