models:
  - name: mart__nasa_donki_gst
    description: "{{ doc('mart__nasa_donki_gst') }}"
    columns:
      - name: gst_id
        description: "{{ doc('col_gst_id') }}"
        tests:
          - not_null
          - unique
      - name: start_time
        description: Start timestamp of the geomagnetic storm event
        tests:
          - not_null
      - name: event_date
        description: Date part of the storm start time
      - name: event_year
        description: Year of the storm event
      - name: event_month
        description: Month of the storm event (1=January, 12=December)
      - name: event_day_of_week
        description: Day of the week of the storm event (0=Sunday, 6=Saturday)
