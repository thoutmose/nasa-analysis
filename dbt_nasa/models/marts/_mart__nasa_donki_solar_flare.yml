models:
  - name: mart__nasa_donki_solar_flare
    description: "{{ doc('mart__nasa_donki_solar_flare') }}"
    columns:
      - name: flr_id
        description: "{{ doc('col_flr_id') }}"
        tests:
          - not_null
          - unique
      - name: begin_time
        description: Start timestamp of the solar flare event
        tests:
          - not_null
      - name: class_type
        description: "{{ doc('col_class_type') }}"
        tests:
          - not_null
      - name: class_category
        description: "{{ doc('col_class_category') }}"
        tests:
          - not_null
      - name: event_date
        description: Date part of the flare begin time
      - name: event_year
        description: Year of the solar flare event
      - name: event_month
        description: Month of the solar flare event (1=January, 12=December)
      - name: event_day_of_week
        description: Day of the week of the solar flare event (0=Sunday, 6=Saturday)
