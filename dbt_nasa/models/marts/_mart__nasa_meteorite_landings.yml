models:
  - name: mart__nasa_meteorite_landings
    description: "{{ doc('mart__nasa_meteorite_landings') }}"
    columns:
      - name: id
        description: Unique identifier for the meteorite landing record
        tests:
          - not_null
          - unique
      - name: name
        description: Name of the meteorite
        tests:
          - not_null
      - name: nametype
        description: Name type classification of the meteorite (Valid or Relict)
      - name: recclass
        description: Mineralogical classification of the meteorite
      - name: mass_grams
        description: "{{ doc('col_mass_grams') }}"
      - name: fall
        description: Whether the meteorite was observed falling (Fell) or found (Found)
      - name: landing_year
        description: "{{ doc('col_landing_year') }}"
      - name: latitude
        description: Latitude of the meteorite landing location, cast to float
      - name: longitude
        description: Longitude of the meteorite landing location, cast to float
      - name: mass_category
        description: "{{ doc('col_mass_category') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['very_small', 'small', 'medium', 'large', 'very_large']
