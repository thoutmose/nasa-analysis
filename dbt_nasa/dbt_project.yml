name: dbt_nasa

profile: dbt_nasa

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

# Snowflake identifiers are case-insensitive when unquoted.
quoting:
  database: false
  schema: false
  identifier: false

models:
  dbt_nasa:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
